name: Apply branch protection

on:
  workflow_dispatch: {}

permissions:
  contents: read
  administration: write

jobs:
  protect-main:
    runs-on: ubuntu-latest

    steps:
      - name: Configure branch-protection for main
        env:
          REPO: ${{ github.repository }}
          API_URL: https://api.github.com/repos/${{ github.repository }}/branches/main/protection
        run: |
          echo "Setting branch protection on main for required checks: Validate notebooks, Build & deploy site"
          curl -sS -X PUT "$API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{
              "required_status_checks": {"strict": true, "contexts": ["Validate notebooks", "Build & deploy site"]},
              "enforce_admins": true,
              "required_pull_request_reviews": {"dismiss_stale_reviews": false, "require_code_owner_reviews": false},
              "restrictions": null
            }'

      - name: Verify branch protection
        run: |
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection"
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API_URL" | jq '.' || true

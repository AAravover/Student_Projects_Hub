name: Build & deploy site

on:
  push:
    branches:
      - main
      - initial_setup

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate notebooks
        run: python scripts/validate_notebooks.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: Ensure Pages is configured to use gh-pages
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "Configuring GitHub Pages to serve from gh-pages branch"
          curl -sS -X PUT "https://api.github.com/repos/${REPO}/pages" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true

      - name: Wait for Pages site to be published and show URL
        run: |
          REPO="${{ github.repository }}"
          for i in $(seq 1 12); do
            resp=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${REPO}/pages" || true)
            status=$(echo "$resp" | jq -r .status // empty)
            url=$(echo "$resp" | jq -r .html_url // empty)
            echo "Pages status: $status; html_url: $url"
            if [ "$status" = "built" ] && [ "$url" != "null" ] && [ -n "$url" ]; then
              echo "Pages available at: $url"
              exit 0
            fi
            sleep 5
          done
          echo "Pages did not become available in time; check repository Settings → Pages"
          exit 1

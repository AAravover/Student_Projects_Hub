name: Validate notebooks

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - initial_setup
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run notebook validator
        run: python scripts/validate_notebooks.py
